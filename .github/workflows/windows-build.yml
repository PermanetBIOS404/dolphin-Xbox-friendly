name: Build Windows (Xbox-friendly)
on:
    workflow_dispatch:
    push:
      branches: [xbox-friendly]
  jobs:
    build:
      runs-on: windows-latest
      timeout-minutes: 120
      steps:
        - uses: actions/checkout@v4
          with:
            submodules: recursive
            fetch-depth: 0
            lfs: true
        - uses: microsoft/setup-msbuild@v2
        - name: Build
          shell: pwsh
          run: msbuild .\Source\dolphin-emu.sln /m /p:Configuration=Release /p:Platform=x64
        - uses: actions/upload-artifact@v4
          with:
            name: Dolphin-Xbox-friendly-Windows
            path: |
              Binary/**
              Binaries/**
            if-no-files-found: error
